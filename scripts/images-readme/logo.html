<!doctype html>
<meta charset="utf-8">
<title>Logo animé d'Essaim</title>
<!--
  Le logo d'Essaim qui s'assemble, pour les GIF du README : l'animation est celle de l'ouverture
  de la fenêtre (ui/lancement.js), ici sur fond noir et avec sa sortie (tout se défait en orbes).

  `rendre.py` appelle `preparer(…)` puis `rendre(t)` image par image, pour docs/images/logo.gif et
  logo-nom.gif. Pour la voir bouger à la main : ouvrir ce fichier avec #jouer (logo seul) ou
  #jouer-nom au bout de l'adresse.
-->
<style>
@font-face { font-family: "Archivo"; src: url("../../ui/polices/Archivo.ttf"); font-weight: 100 900; font-stretch: 62% 125%; }
html, body { margin: 0; background: #000; }
svg { display: block; }
</style>
<svg id="scene" width="400" height="400" role="img" aria-label="Logo d'Essaim"><g id="racine"></g></svg>
<script src="../../ui/lancement.js"></script>
<script>
const scene = document.getElementById("scene");
let animation = null;
// prépare l'animation dans un carré de `cote` pixels ; `sortie` : l'instant où tout se défait.
// Rend sa durée, en secondes.
async function preparer(avecNom, cote, sortie) {
  scene.setAttribute("width", cote);
  scene.setAttribute("height", cote);
  scene.setAttribute("viewBox", avecNom ? "-23 -27 88 88" : "-23 -20 88 88");
  // les lettres sont mesurées et semées dans la police : on attend qu'elle soit chargée
  await document.fonts.load("900 20px Archivo");
  animation = Lancement.monter(document.getElementById("racine"), { nom: avecNom, fin: { genre: "sortie", t: sortie } });
  animation.dessiner(0);
  return animation.duree;
}
// dessine l'instant t, et attend que l'image soit à l'écran
function rendre(t) {
  animation.dessiner(t);
  return new Promise((ok) => requestAnimationFrame(() => requestAnimationFrame(() => ok(true))));
}
window.pret = true;

// à la main : #jouer ou #jouer-nom rejoue l'animation en boucle
if (location.hash.startsWith("#jouer")) {
  preparer(location.hash === "#jouer-nom", Math.min(innerWidth, innerHeight), 4.2).then((duree) => {
    const debut = performance.now();
    (function image(maintenant) { animation.dessiner(((maintenant - debut) / 1000) % (duree + 0.3)); requestAnimationFrame(image); })(debut);
  });
}
</script>
