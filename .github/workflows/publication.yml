# Publication d'une version : pousser un tag `vX.Y.Z` (égal à la version de Cargo.toml) compile
# Essaim sous Windows, lance les tests et crée la version GitHub EN BROUILLON avec :
#   - essaim.exe : l'appli, prête à lancer (c'est ce fichier que les mises à jour automatiques
#     téléchargent : son nom ne doit pas changer) ;
#   - curseur-Dotter.zip : le jeu de curseurs conseillé.
# Le brouillon n'est proposé à personne : depuis son PC, l'auteur recompile le même commit, signe
# cet exe-là (clé jamais présente sur GitHub), le dépose à la place de celui-ci et publie
# (`scripts/signer-version.ps1`). Les mises à jour automatiques refusent un exécutable sans
# signature valide.
#
# Sécurité : la compilation (code de toutes les dépendances : build.rs, macros) tourne sans
# aucun droit d'écriture ni jeton conservé ; seule l'étape de publication, qui ne compile rien,
# peut créer la version. Actions de GitHub seulement, figées par leur commit.
#
# Lancement à la main (onglet Actions, ou `gh workflow run Publication`) : compilation et tests
# seulement, rien n'est publié (pour essayer le workflow sans créer de version).
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  compilation:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Le tag correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml"
          }

      # la fenêtre des réglages refuse tout le script à la moindre erreur de syntaxe (0.8.0)
      - name: Syntaxe de l'interface
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem ui -Filter *.js) {
            node --check $f.FullName
            if ($LASTEXITCODE) { throw "Erreur de syntaxe dans $($f.Name)" }
          }

      - name: Tests
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      - name: Fichiers de la version
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/essaim.exe dist/
          Compress-Archive -Path curseurs/Dotter -DestinationPath dist/curseur-Dotter.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: compilation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version
          path: dist

      - name: Création de la version (brouillon, à signer)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/essaim.exe dist/curseur-Dotter.zip \
            --draft --verify-tag --title "Essaim $TAG" --generate-notes
