name: "Poser une question / Ask a question"
description: "Un réglage que tu ne trouves pas, un doute sur le fonctionnement. / A setting you cannot find, a doubt about how it works."
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Écris en français ou en anglais. Les [questions fréquentes](https://github.com/KingsRequin/essaim#questions-fréquentes) et le [guide](https://github.com/KingsRequin/essaim/blob/master/docs/guide.md) répondent déjà à beaucoup de choses.

        *Write in French or English. The [FAQ](https://github.com/KingsRequin/essaim/blob/master/README.en.md#faq) and the [guide](https://github.com/KingsRequin/essaim/blob/master/docs/guide.md) (French) already answer a lot.*

  - type: textarea
    id: question
    attributes:
      label: "Ta question / Your question"
    validations:
      required: true

  - type: textarea
    id: essais
    attributes:
      label: "Ce que tu as déjà essayé / What you already tried"

  - type: input
    id: version
    attributes:
      label: "Version d'Essaim / Essaim version"
      description: |
        Le numéro écrit à côté du titre ESSAIM, dans la fenêtre des réglages.
        *The number next to the ESSAIM title, in the settings window.*
      placeholder: "0.11.1"
