name: "Signaler un bug / Report a bug"
description: "Quelque chose ne marche pas comme prévu. / Something does not work as expected."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Écris en français ou en anglais.
        Jette d'abord un œil aux [questions fréquentes](https://github.com/KingsRequin/essaim#questions-fréquentes) : la réponse y est peut-être.

        *Thanks for taking the time to report this. Write in French or English.
        Have a look at the [FAQ](https://github.com/KingsRequin/essaim/blob/master/README.en.md#faq) first: the answer may be there.*

  - type: input
    id: version
    attributes:
      label: "Version d'Essaim / Essaim version"
      description: |
        Le numéro écrit à côté du titre ESSAIM, dans la fenêtre des réglages. Avant la 0.11.1 : la ligne « démarrage d'Essaim X.Y.Z » du journal (`%APPDATA%\Essaim\essaim.log`).
        *The number next to the ESSAIM title, in the settings window. Before 0.11.1: the line "démarrage d'Essaim X.Y.Z" in the log (`%APPDATA%\Essaim\essaim.log`).*
      placeholder: "0.11.1"
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: "Windows"
      options:
        - "Windows 11"
        - "Windows 10"
        - "Autre / Other"
    validations:
      required: true

  - type: dropdown
    id: zone
    attributes:
      label: "Où est le problème ? / Where is the problem?"
      description: "Plusieurs choix possibles. / You can pick several."
      multiple: true
      options:
        - "L'essaim autour du pointeur / The swarm around the pointer"
        - "Réaction à la musique (kick, basse, couleurs) / Reaction to music (kick, bass, colours)"
        - "Fenêtre des réglages / Settings window"
        - "Bordure de la fenêtre / Window border"
        - "Curseurs / Cursors"
        - "Presets, règles automatiques, raccourcis / Presets, auto rules, shortcuts"
        - "Fenêtre pour le stream / Stream window"
        - "Installation ou mise à jour / Install or update"
        - "Lenteur, consommation / Slowness, resource use"
        - "Autre / Other"
    validations:
      required: true

  - type: textarea
    id: constat
    attributes:
      label: "Que se passe-t-il ? / What happens?"
      description: |
        Ce que tu vois, le plus précisément possible.
        *What you see, as precisely as you can.*
    validations:
      required: true

  - type: textarea
    id: etapes
    attributes:
      label: "Comment le reproduire ? / How to reproduce it?"
      description: |
        Les étapes, une par ligne. Dis aussi si ça arrive à chaque fois ou de temps en temps.
        *The steps, one per line. Also say whether it happens every time or only sometimes.*
      placeholder: |
        1. Ouvrir les réglages
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: "Qu'attendais-tu à la place ? / What did you expect instead?"

  - type: textarea
    id: journal
    attributes:
      label: "Journal / Log"
      description: |
        Colle la fin de `%APPDATA%\Essaim\essaim.log` (Win + R, puis ce chemin). Il contient le nom des applications passées au premier plan et de tes presets : retire ce que tu ne veux pas montrer.
        *Paste the end of `%APPDATA%\Essaim\essaim.log` (Win + R, then this path). It holds the names of the apps that came to the foreground and of your presets: remove anything you would rather not share.*
      render: text

  - type: textarea
    id: installation
    attributes:
      label: "Ton installation / Your setup"
      description: |
        Nombre d'écrans et mise à l'échelle, carte graphique. Pour un souci de son : le lecteur (Spotify, navigateur…), la sortie (casque, enceintes) et le morceau ou le style de musique.
        *Number of monitors and display scaling, graphics card. For a sound issue: the player (Spotify, browser…), the output (headphones, speakers) and the track or music style.*

  - type: textarea
    id: captures
    attributes:
      label: "Capture d'écran ou vidéo / Screenshot or video"
      description: |
        Glisse tes fichiers ici. Si l'essaim n'apparaît pas dans la capture, décoche *Réglages › Cet ordinateur › Masquer Essaim des captures et des streams*.
        *Drop your files here. If the swarm is missing from the capture, untick "Masquer Essaim des captures et des streams" in Settings › Cet ordinateur.*
