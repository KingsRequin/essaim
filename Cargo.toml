[package]
name = "essaim"
version = "0.26.0"
edition = "2021"
description = "Surcouche réactive à la musique autour du pointeur de Windows : comètes, essaim en orbite, fissures au clic"
license = "MIT"

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
toml = "0.8"
toml_edit = "0.22"
tungstenite = "0.30"
# Capture du son et détection du kick, partagées avec Prisme et Horizon (dépôt voisin). Figée
# par son commit (après v0.2.0 : niveaux stéréo) : un tag peut être déplacé, un commit non.
audio-commun = { git = "https://github.com/KingsRequin/audio-commun", rev = "030312f4ff47e877d535500371f57d212c4cd621", default-features = false, features = ["capture"] }
windows-numerics = "0.3"
wry = { version = "=0.57.1", default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
